name: Build

# ── Release version ─────────────────────────────────────────────────────────
# Version is read from the VERSION file in the repo root.
# Supports labels like "Beta 1.0.0" or plain "1.0.0".
# Tagged releases use this version as-is (e.g. "2.1.0").
# Non-release builds append the CI run number (e.g. "2.1.0.456").
# To override, use workflow_dispatch with a version input.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use APP_VERSION)'
        type: string
        default: ''
      platform:
        description: which platform to build
        type: choice
        options:
        - all
        - mingw64
        - macos
        - nx
        - psvita
        - ps4
        - flatpak
        - appimage
        - android
        - aur
        - deb
      pre_release:
        description: 'Upload artifacts to a GitHub pre-release'
        type: boolean
        default: false
      disable_builtin_nsp:
        description: disable builtin NSP
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
# Build matrix
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_number: ${{ steps.resolve.outputs.version_number }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve build version
        id: resolve
        run: |
          # Read base version from VERSION file
          APP_VERSION="$(cat VERSION | tr -d '\n')"
          BASE="${APP_VERSION#v}"
          BASE_NUM=$(echo "$BASE" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          if [[ -z "$BASE_NUM" ]]; then
            BASE_NUM="0.0.0"
          fi

          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${APP_VERSION}"
          else
            # Non-release: use base version + build number (e.g. 2.1.0.456)
            V="${BASE}.${{ github.run_number }}"
          fi
          V="${V#v}"
          # Extract numeric version for CMake / Vita / PS4 / deb (no labels)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Release: X.Y.Z only
            NUM="${BASE_NUM}"
          else
            # Non-release: X.Y.Z.build
            NUM="${BASE_NUM}.${{ github.run_number }}"
          fi
          # Filename/tag-safe version (spaces → hyphens)
          TAG="${V// /-}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "version_number=${NUM}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Display version: ${V}"
          echo "Numeric version: ${NUM}"
          echo "Tag/filename version: ${TAG}"

  # ───────────────────────────────────────────────
  # Save version override to VERSION file
  # ───────────────────────────────────────────────
  save-version:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Update VERSION file
        run: |
          echo "${{ inputs.version }}" > VERSION
          echo "Updated VERSION to: ${{ inputs.version }}"
          cat VERSION
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update APP_VERSION to ${{ inputs.version }}"
          git push

  upload-release:
    needs: [ resolve-version, build-mingw, build-nx, build-macos, build-flatpak, build-appimage, build-aur, build-ps4, build-vita, build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Assets
        uses: actions/download-artifact@v4
      - name: Package Windows assets
        run: |
          for p in VitaSuwayomi-windows-*; do
            [[ -d $p ]] && 7z a -mx=9 $p.7z ./$p/* && rm -rf $p
          done
      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: VitaSuwayomi ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            VitaSuwayomi-windows-*.7z
            VitaSuwayomi-macos-*/*
            VitaSuwayomi-nx-*/*.nro
            VitaSuwayomi-ps4-*/*
            VitaSuwayomi-vita-*/*.vpk
            VitaSuwayomi-flatpak-*/*.flatpak
            VitaSuwayomi-appimage-*/*.AppImage
            VitaSuwayomi-aur-*/*.pkg.tar.*
            VitaSuwayomi-android-*/*

  # ───────────────────────────────────────────────
  # Pre-release — manually triggered
  # ───────────────────────────────────────────────
  upload-prerelease:
    needs: [resolve-version, build-mingw, build-nx, build-macos, build-flatpak, build-appimage, build-aur, build-ps4, build-vita, build-android, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !cancelled() && !failure() && github.event_name == 'workflow_dispatch' && inputs.pre_release == true }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Rename artifacts for release
        env:
          FVER: ${{ needs.resolve-version.outputs.version_tag }}
        run: |
          mkdir -p release

          # Vita VPK
          for f in $(find . -name "*.vpk"); do
            cp "$f" "release/VitaSuwayomi.${FVER}.vpk"
          done

          # Android APKs (Gradle names them VitaSuwayomi-{abi}.apk)
          for apk in $(find . -name "*.apk"); do
            abi=$(basename "$apk" .apk | sed 's/VitaSuwayomi-//')
            [ -n "$abi" ] && cp "$apk" "release/VitaSuwayomi.${FVER}-${abi}.apk"
          done

          # Windows — zip each arch (exe + dlls + resources)
          for dir in VitaSuwayomi-mingw-*; do
            [ -d "$dir" ] || continue
            arch=$(echo "$dir" | sed -E 's/VitaSuwayomi-mingw-([^-]+)-.*/\1/')
            (cd "$dir" && zip -r "../release/VitaSuwayomi.${FVER}-windows-${arch}.zip" .)
          done

          # Flatpak bundle (single-file .flatpak)
          for fp in $(find . -name "*.flatpak"); do
            cp "$fp" "release/VitaSuwayomi.${FVER}.flatpak"
          done

          # AppImages (self-updating Linux build)
          for ai in $(find . -name "VitaSuwayomi-*.AppImage"); do
            base=$(basename "$ai")
            arch=$(echo "$base" | sed -E 's/VitaSuwayomi-(.+)-[0-9]+\.AppImage/\1/')
            cp "$ai" "release/VitaSuwayomi.${FVER}-${arch}.AppImage"
          done

          # Switch NRO
          for dir in VitaSuwayomi-nx-*; do
            [ -d "$dir" ] || continue
            driver=$(echo "$dir" | sed -E 's/VitaSuwayomi-nx-([^-]+)-.*/\1/')
            nro=$(find "$dir" -name "*.nro" | head -1)
            [ -n "$nro" ] && cp "$nro" "release/VitaSuwayomi.${FVER}-nx-${driver}.nro"
          done

          # PS4 pkg
          for f in $(find . -path "*ps4*" -name "*.pkg"); do
            cp "$f" "release/VitaSuwayomi.${FVER}-ps4.pkg"
          done

          # macOS DMG
          for dir in VitaSuwayomi-macos-*; do
            [ -d "$dir" ] || continue
            tag=$(echo "$dir" | sed -E 's/VitaSuwayomi-macos-([^-]+)-.*/\1/')
            dmg=$(find "$dir" -name "*.dmg" | head -1)
            [ -n "$dmg" ] && cp "$dmg" "release/VitaSuwayomi.${FVER}-macOS-${tag}.dmg"
          done

          # Deb
          for f in $(find . -name "*.deb"); do
            arch=$(dpkg-deb -f "$f" Architecture 2>/dev/null || echo "amd64")
            cp "$f" "release/VitaSuwayomi.${FVER}-Linux_${arch}.deb"
          done

          # AUR
          for f in $(find . -name "*.pkg.tar.zst"); do
            cp "$f" "release/VitaSuwayomi.${FVER}-Linux.pkg.tar.zst"
          done

          echo "Release files:"
          ls -lh release/
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: VitaSuwayomi ${{ needs.resolve-version.outputs.version }}
          tag_name: ${{ needs.resolve-version.outputs.version_tag }}
          prerelease: true
          generate_release_notes: true
          files: release/*

  # ───────────────────────────────────────────────
  # PS Vita — VPK
  # ───────────────────────────────────────────────
  build-vita:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'psvita' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: PS Vita
    runs-on: ubuntu-latest
    container:
      # Pinned, not :latest. A rolling rebuild of :latest moved the base distro
      # (breaking "apk add") and swapped vdpm onto pacman in the same week. The
      # 2026.08 series is what switchfin builds its vita-packages against, so it
      # matches the *-vita.pkg.tar.xz assets fetched below.
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Install build requirements
        run: |
          set -eu
          pkgs_apk="cmake ninja git zstd tar pkgconf"
          pkgs_apt="cmake ninja-build git zstd tar pkg-config"
          if   command -v apk     >/dev/null 2>&1; then apk update && apk add $pkgs_apk
          elif command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $pkgs_apt
          elif command -v dnf     >/dev/null 2>&1; then dnf install -y cmake ninja-build git zstd tar pkgconf-pkg-config
          elif command -v pacman  >/dev/null 2>&1; then pacman -Sy --noconfirm cmake ninja git zstd tar pkgconf
          else echo "No supported package manager found; relying on the image's toolchain"
          fi
          # wget is used by the dependency step and isn't in every base.
          if ! command -v wget >/dev/null 2>&1; then
            if   command -v apk     >/dev/null 2>&1; then apk add wget
            elif command -v apt-get >/dev/null 2>&1; then apt-get install -y --no-install-recommends wget
            fi
          fi
          for tool in cmake ninja git wget; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::$tool missing after dependency install"; exit 1; }
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vita portlibs
        id: cache-vita-portlibs
        uses: actions/cache@v4
        with:
          path: portlib-cache
          # The key IS the pin list, so bumping a version misses and refetches.
          key: vita-portlibs-mbedtls-3.6.7-1_curl-8.16.0-3_ffmpeg-n6.0-3_mpv-0.36.0-3

      - name: Install Vita dependencies
        env:
          BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/vita-packages
        run: |
          set -eu
          # vita-packages is ROLLING — version bumps REPLACE assets, so stale pins
          # 404. Use *-vita.pkg.tar.xz (real pacman packages), NOT the legacy
          # *-arm.tar.xz bare sysroots (no .PKGINFO → "invalid or corrupted package").
          fetch() {
            if command -v curl >/dev/null 2>&1; then
              curl -fL --retry 4 --retry-all-errors --speed-limit 102400 --speed-time 30 -o "$2" "$1"
            else
              wget --tries=4 --read-timeout=30 -O "$2" "$1"
            fi
          }
          mkdir -p portlib-cache
          for pkg in mbedtls-3.6.7-1 curl-8.16.0-3 ffmpeg-n6.0-3 mpv-0.36.0-3; do
            f="portlib-cache/${pkg}-vita.pkg.tar.xz"
            [ -s "$f" ] || fetch "$BASE_URL/${pkg}-vita.pkg.tar.xz" "$f"
          done
          cp portlib-cache/*-vita.pkg.tar.xz .

          # Repo-name packages still go in by name with vdpm.
          VDPM_NONINTERACTIVE=1 vdpm libass harfbuzz fribidi freetype libpng libwebp

          # Local package files: vdpm-on-pacman rejects file paths from --sync, so
          # install them with pacman --upgrade using vdpm's own root/db/cache args
          # (keep a legacy `vdpm <files>` fallback for pre-pacman images).
          PACMAN="${VDPM_PACMAN:-$VITASDK/bin/pacman}"
          if [ -x "$PACMAN" ]; then
            "$PACMAN" \
              --config   "${VDPM_PACMAN_CONF:-$VITASDK/etc/pacman.conf}" \
              --root     "$VITASDK" \
              --dbpath   "$VITASDK/var/lib/pacman" \
              --cachedir "$VITASDK/var/cache/pacman/pkg" \
              --logfile  "$VITASDK/var/log/pacman.log" \
              --noscriptlet --noconfirm --noprogressbar \
              --upgrade $PWD/*-vita.pkg.tar.xz
          else
            vdpm $PWD/*-vita.pkg.tar.xz
          fi

          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_PSV=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-vita-${{ github.run_number }}
          path: build/VitaSuwayomi.vpk
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
             name: VitaSuwayomi-elf-${{ github.run_number }}
             path: build/VitaSuwayomi.velf


  # ───────────────────────────────────────────────
  # Android — switchfin-style APK build
  # ───────────────────────────────────────────────
  build-android:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: Android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27d
        link-to-sdk: true
    - name: Install dependency
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config meson nasm make zstd
    - name: Cache depends
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: jniLibs
        key: jniLibs-${{ hashFiles('scripts/android/Makefile') }}
    - name: Build packages
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        make -C scripts/android TMPDIR=${{ runner.temp }} download
        make -C scripts/android TMPDIR=${{ runner.temp }} ABI=armeabi-v7a \
          ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} build
        make -C scripts/android TMPDIR=${{ runner.temp }} ABI=arm64-v8a \
          ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} build
    - name: Bump version
      uses: chkfung/android-version-actions@v1.2.2
      with:
        gradlePath: app/platform/android/app/build.gradle
        versionCode: ${{ github.run_number }}
        versionName: ${{ needs.resolve-version.outputs.version }}
    - name: Prepare Android sources and native dependencies
      run: |
        rm -rf app/platform/android/app/libs
        mkdir -p app/platform/android/app/libs
        for abi in armeabi-v7a arm64-v8a x86_64; do
          src_libdir="jniLibs/${abi}/lib"
          [ -d "${src_libdir}" ] || continue

          # Normalize optional linker names for CMake (-lpng/-lbz2/-lzstd).
          for missing in png bz2 zstd; do
            [ -e "${src_libdir}/lib${missing}.so" ] && continue
            [ -e "${src_libdir}/lib${missing}.a" ] && continue
            candidate="$(find "${src_libdir}" -maxdepth 1 -type f \( -name "lib${missing}*.so*" -o -name "lib${missing}*.a" \) | head -n1)"
            [ -n "${candidate}" ] || continue
            ln -sfn "$(basename "${candidate}")" "${src_libdir}/lib${missing}.so"
            echo "Aliased ${src_libdir}/lib${missing}.so -> $(basename "${candidate}")"
          done

          # Only stage runtime .so files for packaging to keep Gradle memory low.
          dst_libdir="app/platform/android/app/libs/${abi}"
          mkdir -p "${dst_libdir}"
          find "${src_libdir}" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -a {} "${dst_libdir}/" \;
        done
    - name: Build APK
      # build_libromfs_generator.sh must run before Gradle/CMake configure because
      # borealis's toolchain.cmake unconditionally checks that the generator binary
      # exists when PLATFORM_ANDROID is set — even though USE_LIBROMFS=OFF means
      # the generator is never actually used to embed anything.
      # Resources are loaded via APK assets (see build.gradle syncBorealisResources).
      run: |
        ${{ github.workspace }}/lib/borealis/build_libromfs_generator.sh
        cd app/platform/android && ./gradlew assembleRelease \
          -PappVersion="${{ needs.resolve-version.outputs.version_number }}" \
          -PappDisplayVersion="${{ needs.resolve-version.outputs.version }}"
    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: VitaSuwayomi-android-${{ github.run_number }}
        path: app/platform/android/app/build/outputs/apk/release/*.apk

  # ───────────────────────────────────────────────
  # Flatpak — org.freedesktop.Platform 24.08 (Flathub target)
  # ───────────────────────────────────────────────
  build-flatpak:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'flatpak' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The manifest can't see CI vars and builds the app module from the
      # checkout (source type: dir), so stamp the resolved version into VERSION
      # first — the module's cmake reads it via the VERSION-file fallback, so the
      # in-app Settings version matches the release instead of defaulting.
      - name: Stamp the CI-resolved version into VERSION
        run: echo "${{ needs.resolve-version.outputs.version }}" > VERSION
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: VitaSuwayomi.flatpak
          manifest-path: flatpak/io.github.breezyslasher.VitaSuwayomi.yaml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.breezyslasher.VitaSuwayomi.yaml') }}
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-flatpak-${{ github.run_number }}
          path: VitaSuwayomi.flatpak

  # ───────────────────────────────────────────────
  # AppImage — portable, self-updating Linux (x86_64 + aarch64)
  # ───────────────────────────────────────────────
  build-appimage:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'appimage' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: x86_64, runner: ubuntu-24.04 }
        - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set workspace permissions
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: apt-deb-cache
          key: apt-appimage-${{ runner.arch }}-v1
      - name: Install dependencies
        run: |
          # The amd64 Azure mirror intermittently crawls at KB/s; keep it first
          # but fall back to the public archive on a failed request. arm64 runners
          # use the ports mirror, so only rewrite on amd64.
          if [ "$(dpkg --print-architecture)" = "amd64" ] && [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's|^URIs: .*|URIs: mirror+file:/etc/apt/apt-mirrors.txt|' /etc/apt/sources.list.d/ubuntu.sources
          fi
          mkdir -p apt-deb-cache/partial
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::archives=$PWD/apt-deb-cache \
            install -y --no-install-recommends \
            cmake ninja-build pkg-config patchelf file \
            libcurl4-openssl-dev libmbedtls-dev libmpv-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswresample-dev libswscale-dev libavutil-dev \
            libmp3lame-dev libass-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libwebp-dev libzstd-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev xorg-dev
          sudo rm -rf apt-deb-cache/partial apt-deb-cache/lock
      # Every desktop build FetchContents GLFW (switchfin fork) from GitHub at
      # configure time — the same CDN that intermittently crawls. Cache the
      # fetched sources, keyed on the borealis pin that owns the URLs.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/borealis/library/CMakeLists.txt') }}
      - name: Build and package AppImage
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build

          # Bundle non-system shared deps next to the binary so the AppImage
          # runs on distros that don't ship them; skip libs that are part of
          # the base system (glibc, libstdc++, the GL/Wayland/X11 stack, …).
          BUNDLE_DIR=build/lib
          mkdir -p "$BUNDLE_DIR"
          EXCLUDE='^(/lib(64)?/ld-|.*/(libc|libm|libpthread|libdl|librt|libresolv|libutil|libnsl|libstdc\+\+|libgcc_s|libGL|libGLX|libEGL|libGLdispatch|libGLESv|libOpenGL|libvulkan|libX11|libxcb|libXext|libXrandr|libXi|libXinerama|libXcursor|libXrender|libXfixes|libwayland|libxkbcommon|libdbus|libsystemd|libudev|libdrm|libgbm)[-.]|linux-vdso\.so)'
          declare -A bundled
          UNRESOLVED=""
          walk_deps() {
            local target="$1"
            while IFS= read -r raw; do
              local needed path
              needed=$(echo "$raw" | awk '{print $1}')
              path=$(echo "$raw" | awk '{print $3}')
              if [ "$path" = "not" ]; then
                UNRESOLVED+="${needed} (needed by $(basename "$target"))"$'\n'; continue
              fi
              [[ -z "$path" || ! -f "$path" ]] && continue
              [[ "$path" =~ $EXCLUDE ]] && continue
              local name; name=$(basename "$path")
              if [ -z "${bundled[$name]+x}" ]; then
                cp -L "$path" "$BUNDLE_DIR/"; bundled[$name]=1
                walk_deps "$BUNDLE_DIR/$name"
              fi
            done < <(ldd "$target" 2>/dev/null | awk '/=>/')
          }
          walk_deps build/VitaSuwayomi
          echo "Bundled libraries:"; ls -la "$BUNDLE_DIR" || true
          if [ -n "$UNRESOLVED" ]; then
            echo "::error::ldd reported unresolved dependencies"; printf '%s' "$UNRESOLVED"; exit 1
          fi
          patchelf --set-rpath '$ORIGIN/lib' build/VitaSuwayomi
          for so in "$BUNDLE_DIR"/*.so*; do [ -f "$so" ] || continue; patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true; done

          # ── Assemble the AppDir ─────────────────────────────────────────
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/VitaSuwayomi"
          cp build/VitaSuwayomi "$APPDIR/usr/bin/VitaSuwayomi"
          cp -a build/lib/. "$APPDIR/usr/lib/" 2>/dev/null || true
          cp -r build/resources "$APPDIR/usr/share/VitaSuwayomi/resources"
          patchelf --set-rpath '$ORIGIN/../lib' "$APPDIR/usr/bin/VitaSuwayomi"
          printf '%s\n' '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'cd "$HERE/usr/share/VitaSuwayomi" || exit 1' \
            'exec "$HERE/usr/bin/VitaSuwayomi" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=VitaSuwayomi' \
            'Comment=Suwayomi manga reader' 'Exec=VitaSuwayomi' 'Icon=VitaSuwayomi' \
            'Terminal=false' 'Categories=Graphics;Viewer;Network;' > "$APPDIR/VitaSuwayomi.desktop"
          cp app/platform/icon_desktop.png "$APPDIR/VitaSuwayomi.png"

          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage" -o appimagetool
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "VitaSuwayomi-${{ matrix.arch }}-${{ github.run_number }}.AppImage"
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-appimage-${{ matrix.arch }}-${{ github.run_number }}
          path: VitaSuwayomi-${{ matrix.arch }}-${{ github.run_number }}.AppImage

  # ───────────────────────────────────────────────
  # Nintendo Switch — Matrix (opengl + deko3d)
  # ───────────────────────────────────────────────
  build-nx:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'nx' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: NX (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - { driver: opengl, mpv_pkg: switch-libmpv-0.36.0-5-any.pkg.tar.zst, cmake_extra: "" }
        - { driver: deko3d, mpv_pkg: switch-libmpv-deko3d-0.36.0-5-any.pkg.tar.zst, cmake_extra: "-DUSE_DEKO3D=ON" }
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache Switch portlibs
        uses: actions/cache@v4
        with:
          path: portlib-cache
          key: switch-portlibs-v3-hacBrewPack-3.05-1_libuam-master-1_dav1d-1.5.3-1_mbedtls-3.6.7-1_libssh2-1.11.1-1_ffmpeg-7.1.5-5_uchardet-0.0.8-1_${{ matrix.mpv_pkg }}
      - name: Install switchfin portlibs
        run: |
          BASE_URL="https://github.com/dragonflylee/switchfin/releases/download/switch-portlibs"
          set -eu
          fetch() {
            curl -fL --retry 4 --retry-all-errors \
                 --speed-limit 102400 --speed-time 30 -o "$2" "$1"
          }
          mkdir -p portlib-cache
          # The whole switchfin mpv -> ffmpeg -> tls stack must be installed
          # together so it's ABI-consistent, INCLUDING switch-uchardet, which
          # switch-libmpv depends on (pacman -U on local files can't pull deps
          # from the repo, so a missing one fails "could not satisfy dependencies").
          for pkg in hacBrewPack-3.05-1-x86_64.pkg.tar.zst \
                     libuam-master-1-any.pkg.tar.zst \
                     switch-dav1d-1.5.3-1-any.pkg.tar.zst \
                     switch-mbedtls-3.6.7-1-any.pkg.tar.zst \
                     switch-libssh2-1.11.1-1-any.pkg.tar.zst \
                     switch-ffmpeg-7.1.5-5-any.pkg.tar.zst \
                     switch-uchardet-0.0.8-1-any.pkg.tar.zst \
                     ${{ matrix.mpv_pkg }}; do
            f="portlib-cache/$pkg"
            if [ ! -f "$f" ] || [ "$(stat -c%s "$f" 2>/dev/null || echo 0)" -lt 4096 ]; then
              if ! fetch "$BASE_URL/$pkg" "$f"; then
                rm -f "$f"
                echo "::error::failed to download portlib $pkg"
                exit 1
              fi
            fi
          done
          dkp-pacman --noconfirm -Rdd switch-libmpv || true
          dkp-pacman --noconfirm -Rdd switch-libmpv-deko3d || true
          # Refresh the package databases so pacman -U can pull any remaining
          # dependencies (freetype/fribidi/harfbuzz/…) of the local switchfin
          # files from the devkitPro repo. Our local files still win for the
          # ABI-critical mpv/ffmpeg/tls libs.
          #
          # Best-effort: the devkitPro package server is occasionally flaky, and
          # a failed refresh must NOT fail the build — the local file set is
          # complete (it now includes uchardet), so -U can still resolve against
          # the DB already in the image. Retry a few times, then continue.
          for i in 1 2 3; do
            dkp-pacman --noconfirm -Sy && break
            echo "pacman -Sy failed (attempt $i); retrying…"
            sleep 5
          done
          set +e
          out=$(dkp-pacman --noconfirm -U portlib-cache/*.pkg.tar.zst 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::pacman -U rc=$rc :: $(printf '%s' "$out" | tail -8 | tr '\n' '~')"
            exit "$rc"
          fi
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DPLATFORM_SWITCH=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}" \
            ${{ matrix.cmake_extra }}
          cmake --build build
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-Switch-${{ matrix.driver }}-${{ github.run_number }}
          path: build/VitaSuwayomi.nro

  # ───────────────────────────────────────────────
  # PS4
  # ───────────────────────────────────────────────
  build-ps4:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'ps4' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: PS4
    runs-on: ubuntu-latest
    container:
      image: xfangfang/pacbrew:250221
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install PS4 portlibs
        env:
          BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/pacbrew
        run: |
          for pkg in musl-1.5-3 mbedtls-2.28.10-2 sdl2-2.0.18-19 libcurl-7.80.0-5; do
            pacman --noconfirm -U "$BASE_URL/ps4-openorbis-${pkg}-any.pkg.tar.gz"
          done
      - name: Build
        env:
          OPENORBIS: /opt/pacbrew/ps4/openorbis
        run: |
          cmake -B build -DPLATFORM_PS4=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
      - name: Upload PS4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-ps4-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/**/*.pkg
            build/**/*.oelf

  # ───────────────────────────────────────────────
  # macOS matrix (explicit job name parity)
  # ───────────────────────────────────────────────
  build-macos:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: macOS (${{ matrix.tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { tag: Silicon, arch: arm64, target: "11.0", runner: macos-14 }
        - { tag: Intel, arch: x86_64, target: "11.0", runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: brew install cmake ninja pkg-config curl mbedtls mpv libass freetype harfbuzz fribidi libpng webp zstd glfw
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.target }} \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
      - name: Bundle macOS dylibs
        run: |
          BIN="build/VitaSuwayomi"
          if [ ! -f "$BIN" ]; then
            echo "Expected binary not found: $BIN"
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          queue_file="$tmpdir/queue.txt"
          scanned_file="$tmpdir/scanned.txt"
          bundled_file="$tmpdir/bundled.txt"
          printf '%s\n' "$BIN" > "$queue_file"
          : > "$scanned_file"
          : > "$bundled_file"

          while [ -s "$queue_file" ]; do
            current="$(head -n 1 "$queue_file")"
            tail -n +2 "$queue_file" > "$queue_file.next" || true
            mv "$queue_file.next" "$queue_file"
            printf '%s\n' "$current" >> "$scanned_file"

            while IFS= read -r dep; do
              resolved_dep="$dep"
              case "$dep" in
                /usr/lib/*|/System/*|@executable_path/*|@loader_path/*)
                  continue
                  ;;
                @rpath/*)
                  base_from_rpath="${dep#@rpath/}"
                  resolved_dep=""
                  for probe in \
                    "/usr/local/lib/$base_from_rpath" \
                    "/opt/homebrew/lib/$base_from_rpath" \
                    /usr/local/opt/*/lib/"$base_from_rpath" \
                    /opt/homebrew/opt/*/lib/"$base_from_rpath"; do
                    if [ -f "$probe" ]; then
                      resolved_dep="$probe"
                      break
                    fi
                  done
                  if [ -z "$resolved_dep" ]; then
                    echo "Skipping unresolved @rpath dependency: $dep"
                    continue
                  fi
                  ;;
              esac

              if [ ! -f "$resolved_dep" ]; then
                echo "Skipping missing dependency reference: $dep"
                continue
              fi

              base="$(basename "$resolved_dep")"
              target="build/$base"

              if ! grep -Fxq "$base" "$bundled_file"; then
                cp -f "$resolved_dep" "$target"
                install_name_tool -id "@executable_path/$base" "$target"
                install_name_tool -add_rpath "@executable_path" "$target" 2>/dev/null || true
                printf '%s\n' "$base" >> "$bundled_file"
                echo "Bundled $base (from $(basename "$current"))"
              fi

              install_name_tool -change "$dep" "@executable_path/$base" "$current"

              if ! grep -Fxq "$target" "$scanned_file" && ! grep -Fxq "$target" "$queue_file"; then
                printf '%s\n' "$target" >> "$queue_file"
              fi
            done < <(otool -L "$current" | tail -n +2 | awk '{print $1}')
          done

          install_name_tool -add_rpath "@executable_path" "$BIN" 2>/dev/null || true

          rm -rf "$tmpdir"
      - name: Package macOS DMG
        run: |
          APP_ROOT="build/dmg-root"
          APP_DIR="$APP_ROOT/VitaSuwayomi.app"
          MACOS_DIR="$APP_DIR/Contents/MacOS"

          rm -rf "$APP_ROOT"
          mkdir -p "$MACOS_DIR"

          cp -f build/VitaSuwayomi "$MACOS_DIR/VitaSuwayomi"
          cp -R build/resources "$MACOS_DIR/resources"
          cp -f build/*.dylib "$MACOS_DIR/" 2>/dev/null || true
          chmod +x "$MACOS_DIR/VitaSuwayomi"

          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>VitaSuwayomi</string>
            <key>CFBundleDisplayName</key><string>VitaSuwayomi</string>
            <key>CFBundleIdentifier</key><string>com.vitasuwayomi.app</string>
            <key>CFBundleVersion</key><string>${{ needs.resolve-version.outputs.version_number }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.resolve-version.outputs.version }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>VitaSuwayomi</string>
          </dict>
          </plist>
          PLIST

          hdiutil create \
            -volname "VitaSuwayomi" \
            -srcfolder "$APP_ROOT" \
            -ov \
            -format UDZO \
            "build/VitaSuwayomi-${{ matrix.tag }}.dmg"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-macos-${{ matrix.tag }}-${{ github.run_number }}
          path: |
            build/VitaSuwayomi
            build/VitaSuwayomi-*.dmg
            build/*.dylib
            build/resources/

  # ───────────────────────────────────────────────
  # MinGW matrix (x64/x86/arm64)
  # ───────────────────────────────────────────────
  build-mingw:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'mingw64' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: MinGW (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: x64, sys: mingw64, env: x86_64, runner: windows-latest }
        - { arch: x86, sys: mingw32, env: i686, runner: windows-latest }
        - { arch: arm64, sys: clangarm64, env: clang-aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          path-type: inherit
          cache: false
          release: ${{ contains(matrix.sys, 'arm64') }}
          install: >-
            mingw-w64-${{ matrix.env }}-ninja
            mingw-w64-${{ matrix.env }}-cc
            mingw-w64-${{ matrix.env }}-cmake
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependency
        run: |
          for pkg in glfw-3.5.0-1 curl-8.16.0-1 mpv-0.41.0-1 libwebp-1.6.0-1; do
            curl -sLO https://github.com/dragonflylee/switchfin/releases/download/mingw-packages/${MINGW_PACKAGE_PREFIX}-${pkg}-any.pkg.tar.zst
          done
          pacman -U --noconfirm *.pkg.tar.zst
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON -DUSE_SYSTEM_GLFW=ON -DUSE_D3D11=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
      - name: Bundle runtime DLLs
        run: |
          EXE="build/VitaSuwayomi.exe"
          DLL_DIR="${MINGW_PREFIX}/bin"
          if [ ! -f "$EXE" ]; then
            echo "Expected binary not found: $EXE"
            exit 1
          fi
          if [ ! -d "$DLL_DIR" ]; then
            echo "Expected DLL directory not found: $DLL_DIR"
            exit 1
          fi

          queue=("$EXE")
          declare -A scanned
          declare -A bundled
          while [ ${#queue[@]} -gt 0 ]; do
            current="${queue[0]}"
            queue=("${queue[@]:1}")
            scanned["$current"]=1

            mapfile -t dlls < <(objdump -p "$current" | awk '/DLL Name:/{print $3}' | sort -u)
            for dll in "${dlls[@]}"; do
              candidate="$DLL_DIR/$dll"
              target="build/$dll"
              if [ -f "$candidate" ]; then
                if [ -z "${bundled[$dll]+x}" ]; then
                  cp -f "$candidate" "$target"
                  bundled["$dll"]=1
                  echo "Bundled $dll (from $(basename "$current"))"
                fi
                if [ -z "${scanned[$target]+x}" ]; then
                  queue+=("$target")
                fi
              fi
            done
          done

          echo "DLLs bundled into build/:"
          ls -1 build/*.dll
      - name: Upload mingw artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-mingw-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/VitaSuwayomi.exe
            build/*.dll
            build/resources/

  # ───────────────────────────────────────────────
  # Debian package-like build
  # ───────────────────────────────────────────────
  build-deb:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'deb' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: Deb build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: apt-deb-cache
          key: apt-deb-${{ runner.arch }}-v1
      - name: Install dependencies
        run: |
          if [ "$(dpkg --print-architecture)" = "amd64" ] && [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's|^URIs: .*|URIs: mirror+file:/etc/apt/apt-mirrors.txt|' /etc/apt/sources.list.d/ubuntu.sources
          fi
          mkdir -p apt-deb-cache/partial
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::archives=$PWD/apt-deb-cache install -y \
            cmake ninja-build build-essential git pkg-config zstd \
            libcurl4-openssl-dev libmbedtls-dev libmpv-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswresample-dev libswscale-dev libavutil-dev \
            libmp3lame-dev libass-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libwebp-dev libdbus-1-dev \
            wayland-protocols libwayland-bin libwayland-dev libxkbcommon-dev xorg-dev
          sudo rm -rf apt-deb-cache/partial apt-deb-cache/lock
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/borealis/library/CMakeLists.txt') }}
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
          PKGROOT="pkgroot"
          rm -rf "$PKGROOT"
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin" "$PKGROOT/usr/lib/VitaSuwayomi" "$PKGROOT/usr/share/VitaSuwayomi" "$PKGROOT/usr/share/applications" "$PKGROOT/usr/share/pixmaps"
          install -m 755 build/VitaSuwayomi "$PKGROOT/usr/lib/VitaSuwayomi/VitaSuwayomi"
          {
            echo '#!/usr/bin/env sh'
            echo 'cd /usr/share/VitaSuwayomi || exit 1'
            echo 'exec /usr/lib/VitaSuwayomi/VitaSuwayomi "$@"'
          } > "$PKGROOT/usr/bin/VitaSuwayomi"
          chmod 755 "$PKGROOT/usr/bin/VitaSuwayomi"
          cp -r build/resources "$PKGROOT/usr/share/VitaSuwayomi/resources"
          install -m 644 app/platform/icon_desktop.png "$PKGROOT/usr/share/pixmaps/vitasuwayomi.png"
          {
            echo '[Desktop Entry]'
            echo 'Type=Application'
            echo 'Name=VitaSuwayomi'
            echo 'Comment=Suwayomi desktop client'
            echo 'Exec=VitaSuwayomi'
            echo 'Icon=vitasuwayomi'
            echo 'Terminal=false'
            echo 'Categories=Network;Utility;'
          } > "$PKGROOT/usr/share/applications/vitasuwayomi.desktop"
          ARCH="$(dpkg --print-architecture)"
          {
            echo "Package: vitasuwayomi"
            echo "Version: ${{ needs.resolve-version.outputs.version_number }}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${ARCH}"
            echo "Maintainer: VitaSuwayomi CI <ci@vitasuwayomi.local>"
            echo "Description: VitaSuwayomi desktop build artifact"
          } > "$PKGROOT/DEBIAN/control"
          dpkg-deb --build "$PKGROOT" "VitaSuwayomi-${{ github.run_number }}_${ARCH}.deb"
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-deb-${{ github.run_number }}
          path: VitaSuwayomi-${{ github.run_number }}_*.deb

  # ───────────────────────────────────────────────
  # AUR-like build
  # ───────────────────────────────────────────────
  build-aur:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'aur' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: AUR build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: apt-deb-cache
          key: apt-aur-${{ runner.arch }}-v1
      - name: Install dependencies
        run: |
          if [ "$(dpkg --print-architecture)" = "amd64" ] && [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's|^URIs: .*|URIs: mirror+file:/etc/apt/apt-mirrors.txt|' /etc/apt/sources.list.d/ubuntu.sources
          fi
          mkdir -p apt-deb-cache/partial
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::archives=$PWD/apt-deb-cache install -y \
            cmake ninja-build build-essential git pkg-config zstd \
            libcurl4-openssl-dev libmbedtls-dev libmpv-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswresample-dev libswscale-dev libavutil-dev \
            libmp3lame-dev libass-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libwebp-dev libdbus-1-dev \
            wayland-protocols libwayland-bin libwayland-dev libxkbcommon-dev xorg-dev
          sudo rm -rf apt-deb-cache/partial apt-deb-cache/lock
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/borealis/library/CMakeLists.txt') }}
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
          tar --zstd -cf VitaSuwayomi-${{ github.run_number }}.pkg.tar.zst -C build VitaSuwayomi resources
      - name: Upload aur artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaSuwayomi-aur-${{ github.run_number }}
          path: VitaSuwayomi-${{ github.run_number }}.pkg.tar.zst
